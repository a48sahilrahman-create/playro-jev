name: 24/7 Perpetual Cloud Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  ping-render:
    name: Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloud Backend Health Endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || 'https://play-engine-stremio.onrender.com' }}
        run: |
          echo "Pinging Cloud Play Engine at: $RENDER_APP_URL/health"
          RESPONSE=$(curl -s -L -w "\n%{http_code}" --max-time 30 "$RENDER_APP_URL/health" || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Render backend is active and healthy."
          else
            echo "⚠️ Backend warming up or returned non-200 status code: $HTTP_CODE"
          fi
